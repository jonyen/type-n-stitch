[package]
name = "server"
description = "type-n-stitch HTTP server: upload, transcribe, overdub, export"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
engine = { path = "../engine" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", features = ["multipart", "ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
tracing = "0.1"
futures-util = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json"], default-features = false }
uuid = { version = "1", features = ["v4", "v5", "v7"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
argon2 = "0.5"
# argon2's default features pull in password-hash/rand_core, but not
# rand_core's own `getrandom` feature, so `OsRng` isn't otherwise available.
# Depending on password-hash directly unifies the feature across the graph.
password-hash = { version = "0.5", features = ["getrandom"] }
sha2 = "0.11"
rand = "0.10"
base64 = "0.23"
# One entry for both roles: Cargo unifies features across dev and normal
# dependencies anyway, and the client side is only used by tests.
rmcp = { version = "3.4", features = [
    "server",
    "client",
    "macros",
    "transport-streamable-http-server",
    "transport-streamable-http-client-reqwest",
] }
schemars = "1"
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
# `test-util` gives the tests a clock they can wind forward, so the idle
# reaper can be tested without waiting ten real minutes.
tokio = { version = "1", features = ["full", "test-util"] }
http-body-util = "0.1"
tempfile = "3"
tokio-tungstenite = "0.30"
# rmcp's streamable-HTTP client transport is implemented for reqwest 0.13's
# `Client`, not the 0.12 the server itself speaks, so the end-to-end test
# names that version explicitly rather than the one in `[dependencies]`.
reqwest13 = { package = "reqwest", version = "0.13", default-features = false }
