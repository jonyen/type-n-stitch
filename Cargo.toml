[workspace]
resolver = "2"
members = ["engine", "server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Jonathan Yen <jonyen@gmail.com>"]
license = "MIT"
repository = "https://github.com/jonyen/type-n-stitch"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
